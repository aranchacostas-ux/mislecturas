<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3fb">
<title>Mis lecturas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f7d6e0'/%3E%3Cpath d='M14 18c8-3 15-2 18 2 3-4 10-5 18-2v28c-8-3-15-2-18 2-3-4-10-5-18-2z' fill='%23fffaf5' stroke='%23a8d5c2' stroke-width='2'/%3E%3Cpath d='M32 20v28' stroke='%23c3b1e1' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f7f3fb; --surface: #fffdfd; --fg: #4a4358; --muted: #8a8198;
  --line: #e8e0f0; --accent: #b8a1e3; --accent-fg: #3d3550; --danger: #d9687f;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; min-width: 0; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.kicker { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 2px 0 0; font: 700 32px/1.1 Fraunces, Georgia, serif; text-wrap: balance; }
h2 { font: 700 18px/1.2 Fraunces, Georgia, serif; margin: 0 0 10px; }
h3 { font: 700 17px/1.25 Fraunces, Georgia, serif; margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--danger); }
[hidden] { display: none !important; }
.logo { width: 34px; height: 34px; vertical-align: -7px; margin-right: 8px; }
.acciones-datos { display: flex; gap: 6px; flex-wrap: wrap; }
.acciones-datos button { font-size: 13px; padding: 5px 10px; }

.status { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 12px; margin: 0 0 16px; }

.form { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 22px; display: grid; gap: 12px; min-width: 0; }
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.form input, .form select, .form textarea { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--fg); }
.form textarea { resize: vertical; }
.form .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.form .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.form h2 { margin: 0; }
.error { color: var(--danger); margin: 0; font-size: 13px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat span { display: block; font: 700 28px/1 Fraunces, Georgia, serif; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; }

.generos, .tower, .calendario { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; min-width: 0; }
.meta { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
.gen-title { margin: 0 0 6px; font-weight: 600; font-size: 12px; }
.gen-title .meta { margin: 0; font-weight: 400; }
.donut-wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.donut { width: 96px; height: 96px; position: relative; flex: 0 0 auto; }
.donut svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.donut .seg { cursor: pointer; transition: opacity .15s; }
.donut.hay-sel .seg:not(.sel) { opacity: .4; }
.donut span { position: absolute; inset: 0; display: grid; place-items: center; font: 600 16px Fraunces, Georgia, serif; z-index: 1; pointer-events: none; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; flex: 1; min-width: 140px; font-size: 12px; }
.legend li { display: block; }
.leg-btn { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; width: 100%; padding: 3px 6px; margin: -3px -6px; border: none; border-radius: 6px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.leg-btn[aria-pressed="true"] { background: var(--line); }
.legend i { width: 10px; height: 10px; border-radius: 50%; }
.legend span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend b { font-variant-numeric: tabular-nums; }
.genero-lista { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.genero-lista ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.genero-libro { width: 100%; min-width: 0; padding: 4px 0; border: none; background: none; color: var(--fg); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.genero-libro:hover { text-decoration: underline; }

.tower-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.tower-head h2 { margin: 0; }
.year-nav { display: flex; align-items: center; gap: 8px; }
.year-nav b { font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }
.year-nav button { padding: 2px 10px; }
.shelf { width: min(100%, 300px); margin: 16px auto 0; display: flex; flex-direction: column-reverse; gap: 2px; min-height: 60px; }
.spine { position: relative; display: block; width: 100%; height: 40px; padding: 0; border: 1px solid rgba(61, 53, 80, .25); border-radius: 6px; overflow: hidden; cursor: pointer; box-shadow: 0 3px 6px rgba(0, 0, 0, .25), inset 0 2px 0 rgba(255, 255, 255, .5); }
.spine:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.spine::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 22%; background: #fbf3e4; }
.spine-txt { position: absolute; top: 0; bottom: 0; left: 12px; right: 26%; line-height: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; color: #4a4358; font-weight: 600; font-size: 12px; }
.base { width: min(100%, 300px); height: 10px; margin: 4px auto 0; border-radius: 4px; background: var(--muted); opacity: .5; }
.tower .more { text-align: center; margin: 10px 0 0; }

.calendario .cal-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.cal-head h2 { margin: 0; }
.cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal-week { color: var(--muted); font-size: 11px; text-align: center; margin-bottom: 4px; }
.cal-dia { min-width: 0; min-height: 120px; border: 1px solid var(--line); border-radius: 6px; padding: 3px; overflow: hidden; }
.cal-dia.vacio { border: none; }
.cal-dia.en-rango { background: rgba(184, 161, 227, .16); }
.cal-num { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.cal-dia.hoy .cal-num { color: var(--accent-fg); font-weight: 700; }
.cal-chip { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; width: 100%; min-width: 0; margin-top: 3px; padding: 3px 5px; border: none; border-radius: 4px; text-align: left; font: 600 11px/1.25 Inter, system-ui, sans-serif; color: #3d3550; overflow: hidden; word-break: break-word; cursor: pointer; }
.cal-chip.ini { background: #c4e6b0; }
.cal-chip.fin { background: #f6b8b0; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.filters button { border-radius: 999px; padding: 5px 11px; font-size: 13px; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.filters b { font-variant-numeric: tabular-nums; font-weight: 600; margin-left: 2px; }

.group { margin-bottom: 24px; }
.group summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.group summary::-webkit-details-marker { display: none; }
.group summary::before { content: "\25B8"; color: var(--muted); font-size: 14px; }
.group[open] summary::before { content: "\25BE"; }
.group summary h2 { margin: 0; }
.count { font-size: 12px; color: var(--muted); font-weight: 500; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.card-head > div { min-width: 0; }
.autor { margin: 2px 0 0; color: var(--muted); }
.stars { color: var(--accent-fg); letter-spacing: 1px; white-space: nowrap; font-size: 14px; }
.notas { margin: 8px 0 0; font-style: italic; overflow-wrap: anywhere; }
.card .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.card .actions button { font-size: 13px; padding: 5px 10px; }
.resaltado { outline: 2px solid var(--accent); outline-offset: 3px; }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; border: 1px dashed var(--line); border-radius: 12px; }
.empty p { margin: 4px 0; }

#pagina { min-width: 0; }
.volver { display: inline-block; margin-bottom: 14px; color: var(--accent-fg); text-decoration: none; font-weight: 600; }
.ficha { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; grid-template-columns: 56px 1fr; gap: 16px; min-width: 0; }
.ficha-lomo { min-height: 140px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(61, 53, 80, .2), 0 3px 6px rgba(0, 0, 0, .2); background-image: linear-gradient(90deg, rgba(255, 255, 255, .35), rgba(255, 255, 255, 0) 30%); }
.ficha-cuerpo { min-width: 0; }
.ficha-cuerpo h2 { margin: 4px 0 0; font: 700 26px/1.2 Fraunces, Georgia, serif; text-wrap: balance; }
.ficha-datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; margin: 16px 0 0; }
.ficha-datos dt { color: var(--muted); font-size: 12px; }
.ficha-datos dd { margin: 0; }
.ficha .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
body.vista-libro main > :not(#pagina):not(#status) { display: none; }
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <p class="kicker">Registro de lecturas</p>
      <h1><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#f7d6e0"/><path d="M14 18c8-3 15-2 18 2 3-4 10-5 18-2v28c-8-3-15-2-18 2-3-4-10-5-18-2z" fill="#fffaf5" stroke="#a8d5c2" stroke-width="2"/><path d="M32 20v28" stroke="#c3b1e1" stroke-width="2"/></svg>Mis lecturas</h1>
    </div>
    <div class="acciones-datos">
      <button id="btn-new" class="primary" type="button">Añadir libro</button>
      <button id="btn-exportar" type="button">Exportar</button>
      <button id="btn-importar" type="button">Importar</button>
      <input id="importar" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <p id="status" class="status" hidden></p>
  <section id="pagina" hidden></section>

  <form id="form" class="form" hidden>
    <h2 id="form-title">Añadir libro</h2>
    <label>Título
      <input name="titulo" required maxlength="200">
    </label>
    <label>Autor
      <input name="autor" maxlength="200">
    </label>
    <div class="row">
      <label>Formato
        <select name="formato">
          <option value="papel">Papel</option>
          <option value="ebook">Ebook</option>
          <option value="audio">Audiolibro</option>
        </select>
      </label>
      <label>Estado
        <select name="estado">
          <option value="leyendo">Leyendo</option>
          <option value="pendiente">Pendiente</option>
          <option value="terminado">Terminado</option>
          <option value="abandonado">Abandonado</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>Empezado
        <input type="date" name="empezado">
      </label>
      <label>Terminado
        <input type="date" name="terminado">
      </label>
    </div>
    <label>Valoración
      <select name="valoracion">
        <option value="0">Sin valorar</option>
        <option value="1">1 estrella</option>
        <option value="2">2 estrellas</option>
        <option value="3">3 estrellas</option>
        <option value="4">4 estrellas</option>
        <option value="5">5 estrellas</option>
      </select>
    </label>
    <label>Géneros
      <input name="generos" placeholder="Fantasía, Romance">
    </label>
    <label>Notas
      <textarea name="notas" rows="3"></textarea>
    </label>
    <div class="actions">
      <button type="submit" class="primary">Guardar</button>
      <button type="button" id="cancel">Cancelar</button>
    </div>
    <p id="form-error" class="error" hidden></p>
  </form>

  <div class="stats" id="stats"></div>
  <section class="generos" id="generos"></section>
  <section class="tower" id="tower" aria-live="polite"></section>
  <section class="calendario" id="calendario"></section>
  <nav class="filters" id="filters" aria-label="Filtrar por estado"></nav>
  <div id="list"><p class="empty">Cargando tus libros…</p></div>
</main>

<script>
const KEY = "mis-lecturas-v1";
const ESTADOS = [
  ["leyendo", "Leyendo"],
  ["pendiente", "Pendiente"],
  ["terminado", "Terminado"],
  ["abandonado", "Abandonado"],
];
const FORMATOS = { papel: "Papel", ebook: "Ebook", audio: "Audiolibro" };
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const COLORES = ["#f6b8b0", "#a8ddd3", "#fbd39b", "#c9c4ea", "#c4e6b0", "#b5dcf4", "#f2c6e0", "#d9d2c5"];

let books = [];
let filtro = "todos";
let editId = null;
let borrarId = null;
let anioTorre = new Date().getFullYear();
const cerrados = new Set();
let generoSel = null;
let mesCal = { y: new Date().getFullYear(), m: new Date().getMonth() };
let cargado = false;

const fechaFin = (b) => b.terminado || b.empezado || "";
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[c]));
const fmtFecha = (d) => {
  if (!d) return "";
  const [y, m, dd] = d.split("-");
  return `${dd}/${m}/${y}`;
};
const nombreEstado = (k) => (ESTADOS.find((e) => e[0] === k) || [, k])[1];

function setStatus(msg) {
  const el = $("#status");
  el.textContent = msg || "";
  el.hidden = !msg;
}

function leerGuardados() {
  try {
    const v = JSON.parse(localStorage.getItem(KEY));
    return Array.isArray(v) ? v : null;
  } catch (e) {
    return null;
  }
}

function guardarTodo() {
  try {
    localStorage.setItem(KEY, JSON.stringify(books));
    return true;
  } catch (e) {
    setStatus("No se pudo guardar en este dispositivo: " + e.message);
    return false;
  }
}

function nuevoId() {
  return "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function refrescar() {
  render();
  ruta();
}

function borrar(id) {
  books = books.filter((b) => b.id !== id);
  borrarId = null;
  guardarTodo();
  refrescar();
}

function card(b) {
  const estrellas = b.valoracion ? "★".repeat(b.valoracion) + "☆".repeat(5 - b.valoracion) : "";
  const fechas = [
    b.empezado && `empezado ${fmtFecha(b.empezado)}`,
    b.terminado && `terminado ${fmtFecha(b.terminado)}`,
  ].filter(Boolean).join(" · ");
  const meta = [FORMATOS[b.formato] || "", fechas].filter(Boolean).join(" · ");
  const id = esc(b.id);
  return `
    <article class="card" data-id="${id}">
      <div class="card-head">
        <div>
          <h3>${esc(b.titulo)}</h3>
          <p class="autor">${esc(b.autor) || "Autor desconocido"}</p>
        </div>
        ${estrellas ? `<span class="stars" aria-label="${b.valoracion} de 5">${estrellas}</span>` : ""}
      </div>
      ${meta ? `<p class="meta">${esc(meta)}</p>` : ""}
      ${b.notas ? `<p class="notas">${esc(b.notas)}</p>` : ""}
      <div class="actions">
        <button type="button" data-ver="${id}">Ver</button>
        <button type="button" data-edit="${id}">Editar</button>
        <button type="button" class="danger" data-del="${id}">${borrarId === b.id ? "Confirmar borrar" : "Borrar"}</button>
      </div>
    </article>`;
}

function render() {
  if (!cargado) return;
  const yr = String(new Date().getFullYear());
  const terminadosAnio = books.filter((b) => b.estado === "terminado" && fechaFin(b).startsWith(yr)).length;
  const leyendo = books.filter((b) => b.estado === "leyendo").length;

  $("#stats").innerHTML = `
    <div class="stat"><span>${terminadosAnio}</span><small>terminados en ${yr}</small></div>
    <div class="stat"><span>${leyendo}</span><small>leyendo ahora</small></div>
    <div class="stat"><span>${books.length}</span><small>en total</small></div>`;

  renderGeneros();
  renderTower();
  renderCalendario();

  $("#filters").innerHTML = ["todos", ...ESTADOS.map((e) => e[0])].map((k) => {
    const n = k === "todos" ? books.length : books.filter((b) => b.estado === k).length;
    const label = k === "todos" ? "Todos" : nombreEstado(k);
    return `<button type="button" data-f="${k}" aria-pressed="${filtro === k}">${label} <b>${n}</b></button>`;
  }).join("");

  if (!books.length) {
    $("#list").innerHTML = `<div class="empty"><p>Todavía no hay libros.</p><p>Pulsa "Añadir libro" para apuntar el primero.</p></div>`;
    return;
  }

  const visibles = filtro === "todos" ? books : books.filter((b) => b.estado === filtro);
  const grupos = filtro === "todos" ? ESTADOS.map((e) => e[0]) : [filtro];
  const html = grupos.map((g) => {
    const items = visibles
      .filter((b) => b.estado === g)
      .sort((a, b) => (b.empezado || "").localeCompare(a.empezado || "") || a.titulo.localeCompare(b.titulo));
    if (!items.length) return "";
    return `<details class="group" data-estado="${g}"><summary><h2>${nombreEstado(g)}</h2><span class="count">${items.length}</span></summary>${items.map(card).join("")}</details>`;
  }).join("");

  $("#list").innerHTML = html || `<div class="empty"><p>No hay libros en esta lista.</p></div>`;
}

function renderGeneros() {
  const terminados = books.filter((b) => b.estado === "terminado");
  const cuenta = {};
  terminados.forEach((b) => {
    const lista = Array.isArray(b.generos) && b.generos.length ? b.generos : ["Sin género"];
    lista.forEach((g) => { cuenta[g] = (cuenta[g] || 0) + 1; });
  });
  const orden = Object.entries(cuenta).sort((a, b) => b[1] - a[1]);
  if (!orden.length) {
    $("#generos").innerHTML = "";
    return;
  }
  const suma = orden.reduce((s, [, n]) => s + n, 0);
  const C = 2 * Math.PI * 38;
  let acum = 0;
  const segmentos = orden.map(([g, n], i) => {
    const frac = n / suma;
    const largo = frac * C;
    const ini = acum * C;
    acum += frac;
    const sel = generoSel === g;
    return `<circle class="seg${sel ? " sel" : ""}" data-genero="${esc(g)}" cx="50" cy="50" r="38" fill="none" stroke="${COLORES[i % COLORES.length]}" stroke-width="${sel ? 18 : 14}" stroke-dasharray="${largo} ${C - largo}" stroke-dashoffset="${-ini}" transform="rotate(-90 50 50)"><title>${esc(g)}: ${n}</title></circle>`;
  }).join("");
  const leyenda = orden.map(([g, n], i) => `<li><button type="button" class="leg-btn" data-genero="${esc(g)}" aria-pressed="${generoSel === g}"><i style="background:${COLORES[i % COLORES.length]}"></i><span>${esc(g)}</span><b>${n}</b></button></li>`).join("");
  $("#generos").innerHTML = `
    <p class="gen-title">Leídos por género <span class="meta">${terminados.length} libros terminados</span></p>
    <div class="donut-wrap">
      <div class="donut${generoSel ? " hay-sel" : ""}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="var(--line)" stroke-width="14"/>${segmentos}</svg><span>${terminados.length}</span></div>
      <ul class="legend">${leyenda}</ul>
    </div>
    ${generoSel ? listaGenero(generoSel) : ""}`;
}

function listaGenero(g) {
  const libros = books.filter((b) => b.estado === "terminado" && (g === "Sin género" ? !(b.generos || []).length : (b.generos || []).includes(g)));
  if (!libros.length) return "";
  return `<div class="genero-lista"><p class="gen-title">${esc(g)} <span class="meta">${libros.length} ${libros.length === 1 ? "libro" : "libros"}</span></p><ul>${libros.map((b) => `<li><button type="button" class="genero-libro" data-id="${esc(b.id)}">${esc(b.titulo)}</button></li>`).join("")}</ul></div>`;
}

function renderTower() {
  const actual = String(anioTorre);
  const terminados = books
    .filter((b) => b.estado === "terminado" && fechaFin(b))
    .sort((a, b) => fechaFin(a).localeCompare(fechaFin(b)));
  const deAnio = terminados.filter((b) => fechaFin(b).startsWith(actual));
  const visibles = deAnio.slice(-30);
  const spines = visibles.map((b, i) => {
    const color = COLORES[i % 7];
    return `<button type="button" class="spine" data-id="${esc(b.id)}" style="background:${color}" title="${esc(b.titulo)}"><span class="spine-txt">${esc(b.titulo)}</span></button>`;
  }).join("");
  $("#tower").innerHTML = `
    <div class="tower-head">
      <div>
        <h2>Este año en libros</h2>
        <p class="meta">${deAnio.length} ${deAnio.length === 1 ? "libro terminado" : "libros terminados"} en ${actual}</p>
      </div>
      <div class="year-nav">
        <button type="button" data-year="-1" aria-label="Año anterior">‹</button>
        <b>${actual}</b>
        <button type="button" data-year="1" aria-label="Año siguiente">›</button>
      </div>
    </div>
    <div class="shelf">${spines || '<p class="meta">Aún no hay libros terminados este año.</p>'}</div>
    <div class="base"></div>
    ${deAnio.length > 30 ? `<p class="meta more">Se muestran los 30 últimos de ${deAnio.length}.</p>` : ""}`;
}

function renderCalendario() {
  const { y, m } = mesCal;
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const hoy = new Date();
  const hoyKey = `${hoy.getFullYear()}-${pad(hoy.getMonth() + 1)}-${pad(hoy.getDate())}`;
  const diasMes = new Date(y, m + 1, 0).getDate();
  const offset = (new Date(y, m, 1).getDay() + 6) % 7;
  const eventos = {};
  books.forEach((b) => {
    if (b.empezado) (eventos[b.empezado] ||= { ini: [], fin: [] }).ini.push(b);
    if (b.terminado) (eventos[b.terminado] ||= { ini: [], fin: [] }).fin.push(b);
  });
  const conRango = books.filter((b) => b.empezado && b.terminado);
  let celdas = "";
  for (let i = 0; i < offset; i++) celdas += `<div class="cal-dia vacio"></div>`;
  for (let d = 1; d <= diasMes; d++) {
    const k = iso(d);
    const ev = eventos[k];
    const enRango = conRango.some((b) => k >= b.empezado && k <= b.terminado);
    const chips = ev ? [
      ...ev.ini.map((b) => `<button type="button" class="cal-chip ini" data-id="${esc(b.id)}" title="Empiezo: ${esc(b.titulo)}">▶ ${esc(b.titulo)}</button>`),
      ...ev.fin.map((b) => `<button type="button" class="cal-chip fin" data-id="${esc(b.id)}" title="Termino: ${esc(b.titulo)}">■ ${esc(b.titulo)}</button>`),
    ].join("") : "";
    const clases = ["cal-dia", enRango ? "en-rango" : "", k === hoyKey ? "hoy" : ""].join(" ");
    celdas += `<div class="${clases}"><span class="cal-num">${d}</span>${chips}</div>`;
  }
  const nombreMes = MESES[m][0].toUpperCase() + MESES[m].slice(1);
  $("#calendario").innerHTML = `
    <div class="cal-head">
      <button type="button" data-mes="-1" aria-label="Mes anterior">‹</button>
      <h2>${nombreMes} ${y}</h2>
      <button type="button" data-mes="1" aria-label="Mes siguiente">›</button>
    </div>
    <div class="cal-week"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="cal-grid">${celdas}</div>`;
}

function abrirForm(libro) {
  const form = $("#form");
  editId = libro ? libro.id : null;
  $("#form-title").textContent = libro ? "Editar libro" : "Añadir libro";
  form.reset();
  if (libro) {
    for (const [k, v] of Object.entries(libro)) {
      if (!form.elements[k]) continue;
      form.elements[k].value = Array.isArray(v) ? v.join(", ") : (v ?? "");
    }
    form.elements.valoracion.value = String(libro.valoracion || 0);
  }
  $("#form-error").hidden = true;
  form.hidden = false;
  form.elements.titulo.focus();
  form.scrollIntoView({ behavior: "smooth", block: "start" });
}

function cerrarForm() {
  $("#form").hidden = true;
  editId = null;
}

function mostrarLibro(id) {
  const pagina = $("#pagina");
  pagina.hidden = false;
  if (!cargado) {
    pagina.innerHTML = `<p class="empty">Cargando…</p>`;
    return;
  }
  const libro = books.find((b) => b.id === id);
  if (!libro) {
    pagina.innerHTML = `<a class="volver" href="#">← Volver a mis lecturas</a><p class="empty">No encuentro este libro. Puede que lo hayas borrado.</p>`;
    return;
  }
  const estrellas = libro.valoracion ? "★".repeat(libro.valoracion) + "☆".repeat(5 - libro.valoracion) : "—";
  const color = COLORES[libro.titulo.length % 6];
  pagina.innerHTML = `
    <a class="volver" href="#">← Volver a mis lecturas</a>
    <article class="ficha">
      <div class="ficha-lomo" style="background:${color}"></div>
      <div class="ficha-cuerpo">
        <p class="kicker">${esc(nombreEstado(libro.estado))}</p>
        <h2>${esc(libro.titulo)}</h2>
        <p class="autor">${esc(libro.autor) || "Autor desconocido"}</p>
        <dl class="ficha-datos">
          <div><dt>Formato</dt><dd>${esc(FORMATOS[libro.formato]) || "—"}</dd></div>
          <div><dt>Empezado</dt><dd>${fmtFecha(libro.empezado) || "—"}</dd></div>
          <div><dt>Terminado</dt><dd>${fmtFecha(libro.terminado) || "—"}</dd></div>
          <div><dt>Valoración</dt><dd class="stars">${estrellas}</dd></div>
          <div><dt>Géneros</dt><dd>${esc((libro.generos || []).join(", ")) || "—"}</dd></div>
        </dl>
        ${libro.notas ? `<p class="notas">${esc(libro.notas)}</p>` : ""}
        <div class="actions">
          <button type="button" id="p-editar">Editar</button>
          <button type="button" class="danger" id="p-borrar">${borrarId === libro.id ? "Confirmar borrar" : "Borrar"}</button>
        </div>
      </div>
    </article>`;
  $("#p-editar").onclick = () => {
    document.body.classList.remove("vista-libro");
    location.hash = "";
    abrirForm(libro);
  };
  $("#p-borrar").onclick = () => {
    if (borrarId !== libro.id) {
      borrarId = libro.id;
      mostrarLibro(libro.id);
      return;
    }
    borrar(libro.id);
    location.hash = "";
  };
}

function ruta() {
  const m = location.hash.match(/^#libro-([A-Za-z0-9_-]+)$/);
  if (m) {
    document.body.classList.add("vista-libro");
    mostrarLibro(m[1]);
  } else {
    document.body.classList.remove("vista-libro");
    $("#pagina").hidden = true;
    $("#pagina").innerHTML = "";
  }
}
window.addEventListener("hashchange", ruta);

$("#btn-new").addEventListener("click", () => abrirForm(null));
$("#cancel").addEventListener("click", cerrarForm);

$("#form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const form = ev.currentTarget;
  const err = $("#form-error");
  const f = form.elements;
  const titulo = f.titulo.value.trim();
  if (!titulo) {
    err.textContent = "Pon al menos el título del libro.";
    err.hidden = false;
    return;
  }
  const datos = {
    titulo,
    autor: f.autor.value.trim(),
    formato: f.formato.value,
    estado: f.estado.value,
    empezado: f.empezado.value || "",
    terminado: f.terminado.value || "",
    valoracion: Number(f.valoracion.value) || 0,
    notas: f.notas.value.trim(),
    generos: f.generos.value.split(",").map((s) => s.trim()).filter(Boolean),
  };
  if (editId) {
    const i = books.findIndex((b) => b.id === editId);
    if (i >= 0) books[i] = { id: editId, ...datos };
  } else {
    books.push({ id: nuevoId(), ...datos });
  }
  if (!guardarTodo()) {
    err.textContent = "No se pudo guardar. Revisa el espacio del dispositivo.";
    err.hidden = false;
    return;
  }
  cerrarForm();
  refrescar();
});

$("#list").addEventListener("toggle", (ev) => {
  const d = ev.target;
  if (!d.matches || !d.matches("details.group")) return;
  const g = d.dataset.estado;
  if (d.open) cerrados.delete(g);
  else cerrados.add(g);
}, true);

$("#list").addEventListener("click", (ev) => {
  const ver = ev.target.closest("button[data-ver]");
  if (ver) {
    location.hash = "libro-" + ver.dataset.ver;
    return;
  }
  const edit = ev.target.closest("button[data-edit]");
  if (edit) {
    const libro = books.find((b) => b.id === edit.dataset.edit);
    if (libro) abrirForm(libro);
    return;
  }
  const del = ev.target.closest("button[data-del]");
  if (!del) return;
  const id = del.dataset.del;
  if (borrarId !== id) {
    borrarId = id;
    render();
    return;
  }
  borrar(id);
});

$("#tower").addEventListener("click", (ev) => {
  const sp = ev.target.closest("button.spine");
  if (sp) {
    location.hash = "libro-" + sp.dataset.id;
    return;
  }
  const btn = ev.target.closest("button[data-year]");
  if (!btn) return;
  anioTorre += Number(btn.dataset.year);
  renderTower();
});

$("#generos").addEventListener("click", (ev) => {
  const libro = ev.target.closest("button.genero-libro");
  if (libro) {
    location.hash = "libro-" + libro.dataset.id;
    return;
  }
  const gen = ev.target.closest("button.leg-btn, circle.seg");
  if (!gen) return;
  const g = gen.dataset.genero;
  generoSel = generoSel === g ? null : g;
  renderGeneros();
});

$("#calendario").addEventListener("click", (ev) => {
  const chip = ev.target.closest("button.cal-chip");
  if (chip) {
    location.hash = "libro-" + chip.dataset.id;
    return;
  }
  const nav = ev.target.closest("button[data-mes]");
  if (!nav) return;
  const f = new Date(mesCal.y, mesCal.m + Number(nav.dataset.mes), 1);
  mesCal = { y: f.getFullYear(), m: f.getMonth() };
  renderCalendario();
});

$("#filters").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-f]");
  if (!btn) return;
  filtro = btn.dataset.f;
  render();
});

$("#btn-exportar").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(books, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mis-lecturas.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

$("#btn-importar").addEventListener("click", () => $("#importar").click());

$("#importar").addEventListener("change", async (ev) => {
  const file = ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  try {
    const datos = JSON.parse(await file.text());
    if (!Array.isArray(datos)) throw new Error("el archivo no tiene una lista de libros");
    if (!confirm(`Vas a reemplazar tus libros actuales por ${datos.length} del archivo. ¿Seguro?`)) return;
    books = datos.map((b) => ({ ...b, id: b.id || nuevoId() }));
    guardarTodo();
    setStatus("");
    refrescar();
  } catch (e) {
    setStatus("No se pudo importar: " + e.message);
  }
});

(async () => {
  const guardados = leerGuardados();
  if (guardados) {
    books = guardados;
  } else {
    try {
      const r = await fetch("libros-iniciales.json");
      books = await r.json();
      guardarTodo();
    } catch (e) {
      books = [];
      setStatus("No encuentro los datos iniciales. Empiezas con la lista vacía.");
    }
  }
  cargado = true;
  refrescar();
})();
</script>
<script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }</script>
</body>
